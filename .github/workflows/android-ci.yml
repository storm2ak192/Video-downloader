name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "public/**"
      - "third_party/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.*"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check modified JavaScript module syntax
        run: node --input-type=module --check < public/js/modules/tools/index.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Run Android unit tests and build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mori-Android-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
